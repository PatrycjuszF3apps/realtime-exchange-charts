services:
  realtime_exchange_charts:
    build:
      context: .
      args:
        - UID=1000
        - GID=1000
    ports:
      - "5173:5173"   # Vite frontend
      - "3001:3001"   # Express API (ccxt backend)
    volumes:
      # Mount project into container for hot-reload
      - .:/app
    container_name: app
    hostname: realtime-exchange-charts
    tty: true
    # Install deps and start both the API server and the Vite dev server
    command: bash -c "npm install && npm run dev:all"
